name: CI

on: [push, pull_request]

jobs:
  verify:
    name: lint + formato + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (sintaxis + ESLint)
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Verificar estilos
        run: npx prettier --check styles.css

      - name: Verificar contraste WCAG
        run: npm run check-contrast

      - name: Validar catálogo SQLite y artefactos
        run: npm run validate-catalog

      - name: Tests
        run: npm test
